services:
  mysql:
    image: mysql:8.4
    command:
      - --default-storage-engine=InnoDB
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: a22
    ports:
      # 3306 常被本机 MySQL 占用，容器统一映射至 3307，避免启动冲突。
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Optional local OceanBase target for the canvas OceanBase output node.
  # The platform metadata remains in MySQL; OceanBase is used as a local sink.
  oceanbase:
    profiles: ["oceanbase"]
    image: quay.io/oceanbase/oceanbase-ce:latest
    restart: unless-stopped
    mem_limit: 8g
    shm_size: '1gb'
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
      stack:
        soft: -1
        hard: -1
    environment:
      MODE: slim
      OB_TENANT_PASSWORD: ${OCEANBASE_PASSWORD:-root}
      OB_MEMORY_LIMIT: ${OB_MEMORY_LIMIT:-6G}
      OB_SYSTEM_MEMORY: ${OB_SYSTEM_MEMORY:-512M}
    ports:
      - "127.0.0.1:2881:2881"
    volumes:
      - oceanbase-data:/root/ob
      - oceanbase-cluster:/root/.obd/cluster

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    profiles: ["streaming"]
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  jobmanager:
    profiles: ["streaming"]
    image: flink:1.20-java17
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

  taskmanager:
    profiles: ["streaming"]
    image: flink:1.20-java17
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager

volumes:
  mysql-data:
  oceanbase-data:
  oceanbase-cluster:
